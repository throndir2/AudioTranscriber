instructions: |
  Merge policy: auto-merge your own changes. When a change is done and quickly checked
  locally, commit it, push the session branch, open a pull request against main, and
  merge it right away with `gh pr merge --squash --delete-branch`. Do not wait for review
  or approval. Nothing runs CI on PRs or pushes, so there are no checks to wait for.
  If the merge hits a conflict, rebase on origin/main, fix the conflict, and merge.

  Changelog: this repository is public and every GitHub Release shows its
  `CHANGELOG.md` section as release notes. Every PR with a user-facing change (features,
  behavior/default changes, fixes, removals) must add a short, plain-language bullet
  ending with the PR number, e.g. `(#38)`, under `## Unreleased` → `### Added`, `### Changed`,
  `### Fixed`, or `### Removed` in `CHANGELOG.md`. Describe what users see, not
  implementation details; skip internal-only changes (CI, scripts, refactors, tests, docs).

  Releases: after merging a user-facing change (or when asked), cut a release:
  1. Pick the next version (patch bump of the latest `vX.Y.Z` tag unless asked otherwise).
  2. In a PR, rename `## Unreleased` to `## vX.Y.Z - YYYY-MM-DD` (today's date), add a fresh
     empty `## Unreleased` above it, check the entries are accurate against
     `git log <last-tag>..origin/main`, and merge it.
  3. Dispatch the build-only workflow from main with that exact version:
     `gh workflow run release.yml --ref main -f version=vX.Y.Z`.
  The release fails before tagging if `CHANGELOG.md` has no section for the version.
  Do not add tests or validation jobs to any workflow.
  If Actions refuses to start the job (billing/spending limit), do not retry or change
  billing. Release locally instead: `.\scripts\Publish.ps1 -OutputDirectory <tmp>\publish -RequireEmptyOutput`,
  then `.\scripts\Release.ps1 -Phase Package ...`, create the tag with `gh api` on the merged
  main commit, and run `Release.ps1 -Phase Publish` with `GH_TOKEN=$(gh auth token)` and
  `GITHUB_REPOSITORY=throndir2/AudioTranscriber`.

  Local build: run `.\scripts\Setup.ps1` once per worktree, then use `.tools\dotnet\dotnet.exe`.
