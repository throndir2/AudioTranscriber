name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3). Leave empty to bump the patch of the highest existing vX.Y.Z tag.'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && !github.event.deleted)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_EVENT_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.after }}
      NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create the release tag for a manual run
        id: tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Dot-source first: the script's $Tag parameter would otherwise reset $tag (names are case-insensitive).
          . ./scripts/Release.ps1
          $repo = $env:GITHUB_REPOSITORY
          $tag = "$env:INPUT_VERSION".Trim()
          if (-not $tag) {
            $stable = @(gh api "repos/$repo/git/matching-refs/tags/v" --jq '.[].ref' |
              ForEach-Object { $_ -replace '^refs/tags/', '' } | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
            $highest = $stable | Sort-Object { [version]$_.Substring(1) } -Descending | Select-Object -First 1
            $tag = if ($highest -match '^v(\d+)\.(\d+)\.(\d+)$') { "v$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)" } else { 'v0.1.0' }
          }
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          [void](Get-ReleaseVersion $tag)
          $existing = gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>$null
          if ("$existing" -notmatch '^[0-9a-f]{40}$') {
            gh api -X POST "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not create tag $tag." }
            Write-Output "Created tag $tag at $env:GITHUB_SHA"
          } elseif ($existing -ne $env:GITHUB_SHA) {
            throw "Tag $tag already exists on a different commit. Choose a new version."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate tag and inspect existing release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag || github.ref_name }}
        run: |
          .\scripts\Release.ps1 -Phase Prepare -Tag $env:RELEASE_TAG

      - name: Install release packagers
        if: steps.prepare.outputs.needs-build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis rpm

      - name: Set up the pinned SDK and cached packages
        if: steps.prepare.outputs.needs-build == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/**/packages*.lock.json

      - name: Cross-publish and package Windows and Linux x64
        if: steps.prepare.outputs.needs-build == 'true'
        id: package
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: |
          $publishWin = Join-Path $env:RUNNER_TEMP 'publish-win-x64'
          $publishLinux = Join-Path $env:RUNNER_TEMP 'publish-linux-x64'
          $assets = Join-Path $env:RUNNER_TEMP 'release-assets'
          .\scripts\Publish.ps1 -DotnetPath (Get-Command dotnet).Source -Runtime win-x64 -OutputDirectory $publishWin -RequireEmptyOutput
          .\scripts\Publish.ps1 -DotnetPath (Get-Command dotnet).Source -Runtime linux-x64 -OutputDirectory $publishLinux -RequireEmptyOutput
          .\scripts\Release.ps1 -Phase Package -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT `
            -PublishDirectory $publishWin -LinuxPublishDirectory $publishLinux -AssetDirectory $assets

      - name: Publish the verified assets to GitHub Release
        if: steps.prepare.outputs.needs-publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
          RELEASE_ASSET_DIRECTORY: ${{ steps.package.outputs.asset_directory }}
        run: |
          .\scripts\Release.ps1 -Phase Publish -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT `
            -AssetDirectory $env:RELEASE_ASSET_DIRECTORY

