name: Release build

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_EVENT_SHA: ${{ github.event.after }}
      NUGET_PACKAGES: ${{ github.workspace }}/.tools/nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the exact tag event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate tag and inspect existing release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\Release.ps1 -Phase Prepare -Tag $env:RELEASE_TAG

      - name: Set up the pinned SDK and cached packages
        if: steps.prepare.outputs.needs-build == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            src/**/packages*.lock.json

      - name: Cross-publish and package Windows x64
        if: steps.prepare.outputs.needs-build == 'true'
        id: package
        env:
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'publish'
          .\scripts\Publish.ps1 -DotnetPath (Get-Command dotnet).Source -OutputDirectory $publish -RequireEmptyOutput
          .\scripts\Release.ps1 -Phase Package -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT `
            -PublishDirectory $publish -AssetDirectory (Join-Path $env:RUNNER_TEMP 'release-assets')

      - name: Publish the verified assets to GitHub Release
        if: steps.prepare.outputs.needs-publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip }}
          RELEASE_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          .\scripts\Release.ps1 -Phase Publish -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT `
            -ZipPath $env:RELEASE_ZIP -ChecksumPath $env:RELEASE_CHECKSUM
